# Workflow CI del taller src — WoldVirtualP2P3D
# ================================================
# Ubicacion: src/STM_HRTS/.github/workflows/ci.yml
#
# Este fichero esta dentro del taller porque el arbol de trabajo RFPRMN no se commitea directo a la
# raiz del repo. Para activarlo hay que copiarlo a `.github/workflows/` en la raiz — eso exige salir
# de `src/` y es decision del dueño (queda anotado en el issue #65, P0-2).
#
# Reescrito el 2026-11-05 (U5.3) sobre el arbol unificado. Lo que cambio respecto a la version previa:
#   - las rutas del taller se RESUELVEN buscando VERSION.json, sin hardcodear `CONTRRF/TLLDCD/src`:
#     el arbol promocionado vive bajo `PRY/actualizacion_<hash>/src` y el hash cambia en cada merge,
#     asi que cualquier working-directory fijo apuntaba a una carpeta que no esta en git.
#   - `Visor3D.csproj` → `Visor3D.sln` (desde U3 hay cuatro proyectos y el portal ya no compila solo).
#   - cae el `continue-on-error` de la suite Python completa: con las 174 pruebas verdes medida a
#     medida, seguir en rojo silencioso era el mismo defecto que DT-13 imputaba al `catch { }`.
#   - entran las seis autopruebas del ejecutable (faltaban --webnodo-selftest y --startup-selftest),
#     cada una con su runtime temporal (DT-15).
#   - la version del binario se contrasta contra src/VERSION.json: es la unica fuente desde U5.1.
#
# Fuera de alcance aqui: la suite headless de Godot (probar_*.gd) necesita el binario del motor y el
# PCK, que no se commitean. Se ejecuta en local con
# `python STM_HRTS/utils/add_utils/__main__.py ejecutar <prueba>` y su evidencia va a STM_DOC.
# EXCEPTO la puerta de DT-05 (job godot-headless mas abajo): usa el arbol fuente, que si esta
# versionado, y omite las nueve pruebas que exigen el PCK exportado.

name: CI – WoldVirtualP2P3D src

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  resolver-taller:
    name: Localizar el taller src
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.busca.outputs.src }}
      version: ${{ steps.busca.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Buscar VERSION.json (unica fuente de la version)
        id: busca
        run: |
          fichero=$(find . -name VERSION.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$fichero" ]; then
            echo "::error::No hay VERSION.json en el arbol: la version unica (U5.1) se ha perdido."
            exit 1
          fi
          src=$(dirname "$fichero")
          ver=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$fichero")
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Taller: $src · version $ver"

  python-suite:
    name: Python tests (H1 + suite src)
    needs: resolver-taller
    runs-on: ubuntu-latest
    env:
      SRC: ${{ needs.resolver-taller.outputs.src }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        working-directory: ${{ env.SRC }}/STM_HRTS/utils/add_utils
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" || pip install numpy pytest pytest-timeout

      - name: Verificar rutas del taller
        working-directory: ${{ env.SRC }}
        run: |
          python -c "
          from STM_HRTS.utils.add_utils.rutas import verificar, faltantes
          inf = verificar()
          falt = faltantes(inf)
          print(f'Rutas OK: {len(inf) - len(falt)}/{len(inf)}')
          [print(f'  FALTA: {f[\"nombre\"]} -> {f[\"ruta\"]}') for f in falt]
          "

      - name: Version unica (VERSION.json contra el arbol)
        working-directory: ${{ env.SRC }}
        run: python STM_HRTS/utils/add_utils/version_unica.py --comprobar

      - name: Suite de contencion H1 (estricta)
        working-directory: ${{ env.SRC }}
        run: |
          python -m pytest tests/test_h1_contencion.py -v \
            --rootdir . \
            --timeout=30 \
            --tb=short \
            -c STM_HRTS/utils/add_utils/pytest.ini

      - name: Suite Python completa
        working-directory: ${{ env.SRC }}
        run: |
          python -m pytest tests/ -v \
            --rootdir . \
            --timeout=60 \
            --tb=short \
            --ignore=tests/test_h1_contencion.py \
            -c STM_HRTS/utils/add_utils/pytest.ini \
            -k "not ipfs_deteccion_resiliente"

  csharp-suite:
    name: C# Visor3D (build + xUnit + 6 selftests)
    needs: resolver-taller
    runs-on: windows-latest
    env:
      SRC: ${{ needs.resolver-taller.outputs.src }}
      WOLD_VERSION: ${{ needs.resolver-taller.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar la solucion
        working-directory: ${{ env.SRC }}/VSC#
        run: dotnet build Visor3D.sln -c Debug

      - name: Pruebas unitarias xUnit
        working-directory: ${{ env.SRC }}/VSC#
        run: dotnet test Visor3D.sln -c Debug --no-build

      - name: Localizar el ejecutable publicado por la solucion
        id: exe
        run: |
          exe=$(find "$SRC/VSC#/bin" -name "DMWoldVirtualP2P3Dv*.exe" | head -1)
          if [ -z "$exe" ]; then
            echo "::error::No hay DMWoldVirtualP2P3Dv*.exe en VSC#/bin tras compilar."
            exit 1
          fi
          case "$exe" in
            *"v$WOLD_VERSION.exe") echo "ok: $exe anuncia $WOLD_VERSION" ;;
            *) echo "::error::El binario se llama $(basename "$exe") pero VERSION.json dicta $WOLD_VERSION." && exit 1 ;;
          esac
          echo "exe=$exe" >> "$GITHUB_OUTPUT"

      - name: Autopruebas del ejecutable (runtime y log temporales, DT-15)
        run: |
          exe="${{ steps.exe.outputs.exe }}"
          for bandera in --startup-selftest --red-selftest --cuenta-selftest --update-selftest --chat-selftest --webnodo-selftest; do
            export WOLD_RUNTIME_DIR="$(mktemp -d)"
            # WOLD_LOG_DIR: los reinicios de cuenta tiran INFOs falsos al log local
            # que el visor ofrece como "diagnostico". En un runner da igual, pero el
            # comando canonico es el que se copia y pega en local.
            export WOLD_LOG_DIR="$(mktemp -d)"
            echo "=== $bandera ==="
            "$exe" "$bandera"
            codigo=$?
            if [ $codigo -ne 0 ]; then
              echo "::error::$bandera devolvio $codigo"
              exit $codigo
            fi
          done

  godot-headless:
    name: Godot headless (puerta DT-05, solo arbol)
    needs: resolver-taller
    runs-on: ubuntu-latest
    env:
      SRC: ${{ needs.resolver-taller.outputs.src }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        working-directory: ${{ env.SRC }}/STM_HRTS/utils/add_utils
        run: pip install pytest pytest-timeout

      # El numero del motor tampoco se cablea: sale del campo `motor` de VERSION.json (U5.1).
      - name: Resolver la version del motor
        id: motor
        run: |
          ver=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['motor'])" "$SRC/VERSION.json")
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "Motor declarado en VERSION.json: $ver"

      - name: Descargar Godot (linux x86_64)
        run: |
          ver="${{ steps.motor.outputs.ver }}"
          zip="Godot_v${ver}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${ver}-stable/${zip}"
          unzip -q godot.zip
          echo "GODOT_BIN=$PWD/Godot_v${ver}-stable_linux.x86_64" >> "$GITHUB_ENV"

      # En el runner no hay PCK exportado (esta en .gitignore), asi que las nueve pruebas
      # declaradas en PCK_OBLIGATORIO se omiten solas: la puerta local es la que las cubre.
      # Los `Parse Error: [ext_resource]` del modo arbol se toleran por el mismo motivo.
      - name: Puerta headless de Godot
        working-directory: ${{ env.SRC }}
        run: |
          python -m pytest tests/godot -v -m godot \
            --rootdir . \
            -c STM_HRTS/utils/add_utils/pytest.ini \
            --timeout=200 --timeout-method=thread

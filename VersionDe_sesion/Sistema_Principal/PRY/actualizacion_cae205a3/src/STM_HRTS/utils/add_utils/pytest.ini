[pytest]
testpaths = tests
pythonpath = .
cache_dir = STM_HRTS/.pytest_cache
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# La puerta de Godot (DT-05) lanza el motor: se puede aislar con `-m godot`
# o excluir con `-m "not godot"` cuando no hay binario ni ganas de esperar.
markers =
    godot: prueba que ejecuta el motor Godot sobre los probar_*.gd del taller.
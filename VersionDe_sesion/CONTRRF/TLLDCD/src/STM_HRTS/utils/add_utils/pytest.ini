[pytest]
# La cache vive dentro del paquete (add_utils/STM_HRTS). El rootdir lo fija la
# herramienta (comando_pytest) en src/, asi que la ruta va relativa a src/.
testpaths = tests
pythonpath = .
cache_dir = STM_HRTS/utils/add_utils/STM_HRTS/.pytest_cache
python_files = test_*.py
python_classes = Test*
python_functions = test_*
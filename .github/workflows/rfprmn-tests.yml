name: STM_RFPRMN

on:
  push:
    paths:
      - "VersionDe_sesion/CONTRRF/STM_RFC/STM_RFPRMN/**"
      - ".github/workflows/rfprmn-tests.yml"
  pull_request:
    paths:
      - "VersionDe_sesion/CONTRRF/STM_RFC/STM_RFPRMN/**"
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }} · Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: VersionDe_sesion/CONTRRF/STM_RFC/STM_RFPRMN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Dependencias
        run: python -m pip install --upgrade pip numpy pytest ruff

      - name: Nombres indefinidos (F821/F811/E9)
        run: python -m ruff check --select F821,F811,E9 --no-cache .

      - name: Presupuesto de líneas (máx. 450)
        run: python RFPRMN.py --presupuesto

      - name: Estado de los submódulos
        run: python RFPRMN.py --estado

      - name: Pruebas
        run: python -m pytest tests -q -p no:cacheprovider

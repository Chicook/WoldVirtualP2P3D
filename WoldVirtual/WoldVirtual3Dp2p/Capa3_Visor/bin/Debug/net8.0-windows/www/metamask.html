<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoldVirtual — Conectar Wallet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050811;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* Grid de fondo Cyberpunk */
        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
        /* Contenedor principal con efecto de cristal y neón */
        .wallet-card {
            position: relative;
            z-index: 2;
            width: 440px;
            background: rgba(10, 16, 32, 0.85);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.15);
            backdrop-filter: blur(10px);
        }
        /* Esquinas Sci-Fi decorativas */
        .wallet-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 20px;
            height: 20px;
            border-top: 3px solid #00d9ff;
            border-left: 3px solid #00d9ff;
            border-top-left-radius: 16px;
        }
        .wallet-card::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 20px;
            height: 20px;
            border-bottom: 3px solid #00ff8c;
            border-right: 3px solid #00ff8c;
            border-bottom-right-radius: 16px;
        }
        /* Icono de Zorro MetaMask en SVG brillante */
        .wallet-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 10px rgba(230, 119, 0, 0.5));
            transition: transform 0.3s ease;
        }
        .wallet-icon:hover {
            transform: scale(1.1) rotate(5deg);
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #00d9ff;
            text-shadow: 0 0 8px rgba(0, 217, 255, 0.4);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            font-size: 13px;
            color: #8e9cb2;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .session-info {
            background: rgba(17, 27, 48, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            text-align: left;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-label {
            color: #8e9cb2;
            font-weight: 600;
        }
        .info-val {
            color: #00ff8c;
            font-weight: 700;
        }
        /* Botón de acción con neón */
        .btn-connect {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #00d9ff 0%, #0077ff 100%);
            color: #050811;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 217, 255, 0.7);
            background: linear-gradient(135deg, #00ff8c 0%, #00aa66 100%);
        }
        .btn-connect:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="wallet-card">
        <!-- Zorro de Metamask en SVG Plano de Alta Calidad -->
        <svg class="wallet-icon" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
            <g fill="none" fill-rule="evenodd">
                <path d="M298.667 80l-21.334-32-64 16L160 16 106.667 64l-64-16L21.333 80l53.334 26.667 5.333 106.666L160 304l80-90.667 5.333-106.666z" fill="#E67E22"/>
                <path d="M160 16l53.333 48H106.667z" fill="#D35400"/>
                <path d="M160 304l-80-90.667H240z" fill="#E67E22"/>
                <path d="M240 213.333l-26.667 26.667-53.333-10.667-53.333 10.667-26.667-26.667L160 256z" fill="#F39C12"/>
                <path d="M160 117.333l-53.333 32H213.333z" fill="#2C3E50"/>
                <circle cx="106.667" cy="149.333" r="16" fill="#F1C40F"/>
                <circle cx="213.333" cy="149.333" r="16" fill="#F1C40F"/>
                <circle cx="106.667" cy="149.333" r="6" fill="#2C3E50"/>
                <circle cx="213.333" cy="149.333" r="6" fill="#2C3E50"/>
            </g>
        </svg>

        <h1>CONECTAR METAMASK</h1>
        <p>Autoriza la firma DeFi de tu nodo virtual para desbloquear el metaverso 3D.</p>

        <div class="session-info">
            <div class="info-row">
                <span class="info-label">NODO USUARIO:</span>
                <span class="info-val" id="lblUser">cargando...</span>
            </div>
            <div class="info-row">
                <span class="info-label">ISLA ASIGNADA:</span>
                <span class="info-val" id="lblIsland">cargando...</span>
            </div>
        </div>

        <button class="btn-connect" onclick="connectWallet()">CONECTAR Y ENTRAR</button>
    </div>

    <script>
        // Obtener parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user') || 'Usuario';
        const islandId = urlParams.get('islandId') || '137 : 190.1.0';

        document.getElementById('lblUser').innerText = username.toUpperCase();
        document.getElementById('lblIsland').innerText = islandId;

        async function connectWallet() {
            // Detectar el proveedor específico de MetaMask ante conflictos con Coinbase u otras wallets
            let provider = null;
            if (typeof window.ethereum !== 'undefined') {
                if (window.ethereum.providers && window.ethereum.providers.length > 0) {
                    // Buscar en la lista de proveedores inyectados el que sea MetaMask
                    provider = window.ethereum.providers.find(p => p.isMetaMask);
                } else if (window.ethereum.isMetaMask) {
                    provider = window.ethereum;
                }
            }

            // Si se detecta MetaMask específicamente
            if (provider) {
                try {
                    // 1. Solicitar acceso a las cuentas utilizando únicamente el proveedor de MetaMask
                    const accounts = await provider.request({ method: 'eth_requestAccounts' });
                    if (accounts && accounts.length > 0) {
                        const walletAddress = accounts[0];
                        
                        // 2. Preparar el mensaje formal de firma DeFi
                        const timestamp = new Date().toLocaleString('es-ES', { timeZoneName: 'short' });
                        const message = `AUTENTICACIÓN DE NODO VIRTUAL — WOLDVIRTUAL P2P\n\n` +
                                        `• Usuario de Cuenta: ${username}\n` +
                                        `• Isla Asignada: ${islandId}\n` +
                                        `• Dirección de Billetera: ${walletAddress}\n` +
                                        `• Fecha y Hora Local: ${timestamp}\n\n` +
                                        `Firma este mensaje para validar la propiedad de esta firma criptográfica y autorizar el acceso del Visor 3D a tu nodo.`;
                        
                        // Convertir mensaje a formato hexadecimal para personal_sign
                        const hexMessage = '0x' + Array.from(new TextEncoder().encode(message))
                            .map(b => b.toString(16).padStart(2, '0'))
                            .join('');
                        
                        // 3. Solicitar la firma real usando únicamente MetaMask
                        const signature = await provider.request({
                            method: 'personal_sign',
                            params: [hexMessage, walletAddress]
                        });
                        
                        // 4. Redirigir al endpoint /confirm del Visor local incluyendo la firma obtenida
                        window.location.href = `/confirm?user=${encodeURIComponent(username)}&wallet=${walletAddress}&islandId=${encodeURIComponent(islandId)}&signature=${encodeURIComponent(signature)}`;
                        return;
                    }
                } catch (error) {
                    alert("Firma de MetaMask denegada o cancelada por el usuario:\n" + error.message);
                    return;
                }
            }
            
            // Fallback: Generar una wallet simulada con firma de desarrollo si no tiene MetaMask
            alert("MetaMask específico no detectado (o bloqueado por otra extensión como Coinbase). Usando firma de desarrollo simulada.");
            const characters = '0123456789abcdef';
            let randomWallet = '0x';
            for (let i = 0; i < 40; i++) {
                randomWallet += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            const dummySignature = '0x_simulated_signature_' + Math.random().toString(36).substring(2);

            // Redirigir al endpoint /confirm del Visor local
            window.location.href = `/confirm?user=${encodeURIComponent(username)}&wallet=${randomWallet}&islandId=${encodeURIComponent(islandId)}&signature=${dummySignature}`;
        }
    </script>
</body>
</html>

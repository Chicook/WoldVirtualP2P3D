<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoldVirtualP2P3D – UX module</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#c9d3cc; --ink:#10252b; --muted:#4b6168; --lagoon:#1f8f89; --on-lagoon:#fff;
  --hi:#e6eee9; --lo:#a3b0a8; --ok:#2e9e5b; --wait:#d19a1c; --off:#c24a3a;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16262b;--ink:#e3ece8;--muted:#9bb0b0;--lagoon:#46c2ba;--on-lagoon:#06201f;--hi:#20363c;--lo:#0d1a1e;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--lagoon);outline-offset:3px}

/* ---- Top bar: status + lite mode + language ---- */
#wux-bar{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
  justify-content:space-between;padding:10px 12px;z-index:20;pointer-events:none}
#wux-bar>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;
  background:var(--bg);box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);font-size:14px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--off);flex:none}
[data-status=connected] .dot{background:var(--ok)}
[data-status=searching] .dot{background:var(--wait);animation:pulse 1.2s ease-in-out infinite}
[data-status=local] .dot{background:var(--off)}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.tools{display:flex;gap:8px}
.chip[aria-pressed=true]{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}

/* ---- Onboarding ---- */
#wux{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:var(--bg);z-index:30}
#wux[hidden]{display:none}
.card{width:min(440px,100%);padding:28px 24px;border-radius:28px;background:var(--bg);
  box-shadow:10px 10px 22px var(--lo),-10px -10px 22px var(--hi)}
.lucia{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;
  color:var(--on-lagoon);background:var(--lagoon);box-shadow:inset 2px 2px 5px rgba(255,255,255,.35),inset -3px -3px 6px rgba(0,0,0,.25)}
h1{font-size:26px;line-height:1.2;margin:0 0 8px}
p{margin:0 0 22px;color:var(--muted);font-size:17px;max-width:42ch}
.primary{width:100%;min-height:56px;border-radius:28px;font-weight:700;font-size:18px;
  background:var(--lagoon);color:var(--on-lagoon);box-shadow:5px 5px 12px var(--lo),-5px -5px 12px var(--hi)}
.primary:active{box-shadow:inset 3px 3px 7px rgba(0,0,0,.25)}
.primary[disabled]{opacity:.6;cursor:progress}
.link{display:block;margin:14px auto 0;min-height:44px;padding:0 12px;color:var(--muted);text-decoration:underline}
.steps{display:flex;gap:8px;justify-content:center;margin-top:18px}
.steps i{width:28px;height:6px;border-radius:3px;background:var(--lo)}
.steps i.on{background:var(--lagoon)}
.ok-line{min-height:26px;margin:-8px 0 14px;color:var(--ok);font-weight:600}

/* Presence pad */
.pad{display:grid;place-items:center;width:160px;height:160px;margin:0 auto 22px;border-radius:50%;
  font-weight:700;background:var(--bg);box-shadow:8px 8px 18px var(--lo),-8px -8px 18px var(--hi)}
.pad:active,.pad.done{box-shadow:inset 6px 6px 14px var(--lo),inset -6px -6px 14px var(--hi)}
.pad.done{color:var(--ok)}
.stamp{display:none;margin:0 auto 18px;width:84px;height:84px;border-radius:50%;place-items:center;font-size:34px;
  color:var(--lagoon);border:3px double var(--lagoon);transform:rotate(-8deg)}
.stamp.show{display:grid;animation:thud .35s ease-out}
@keyframes thud{from{transform:rotate(-8deg) scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Demo scene (replace with your Three.js canvas) */
#scene{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
</style>
</head>
<body>

<div id="wux-bar">
  <div class="chip" id="wux-status" data-status="searching" role="status" aria-live="polite">
    <span class="dot"></span><span id="wux-status-text"></span>
  </div>
  <div class="tools">
    <button class="chip" id="wux-lite" aria-pressed="false"></button>
    <button class="chip" id="wux-lang" aria-label="Harshe / Language">HA</button>
  </div>
</div>

<!-- ===== Replace this with your Three.js / Godot view ===== -->
<div id="scene"><div><div style="font-size:20px;font-weight:600;color:var(--ink)">Isla Embossed</div>
<div id="scene-note"></div></div></div>

<div id="wux" role="dialog" aria-modal="true" aria-labelledby="wux-title" hidden>
  <div class="card">
    <div class="lucia"><div class="avatar" aria-hidden="true">L</div><strong>LucIA</strong></div>
    <h1 id="wux-title"></h1>
    <p id="wux-body"></p>
    <div class="pad" id="wux-pad" role="button" tabindex="0" hidden></div>
    <div class="stamp" id="wux-stamp" aria-hidden="true">✓</div>
    <div class="ok-line" id="wux-ok" role="status" aria-live="polite"></div>
    <button class="primary" id="wux-next"></button>
    <button class="link" id="wux-skip"></button>
    <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</div>

<script>
(() => {
  /* ---------- Text (Hausa / English). Add more languages here. ---------- */
  const T = {
    ha: {
      status:{connected:"An haɗu",searching:"Ana neman nodes…",local:"A gida kawai"},
      lite:"Yanayin sauƙi", skip:"Tsallake", note:"Wannan ne wurin da shafin 3D naka zai kasance.",
      s:[
        {t:"Sannu! Ni LucIA ce.",b:"Zan nuna maka tsibirin. Zai ɗauki ƙasa da minti ɗaya.",btn:"Ci gaba"},
        {t:"Shiga tsibirin",b:"Za a ƙirƙiri shaidarka a wannan na'urar. Ba sai ka yi wani abu ba.",btn:"Shiga",busy:"Ana ƙirƙira…",ok:"An ƙirƙiri shaidarka ✓"},
        {t:"Ka tabbatar da kasancewarka",b:"Taɓa da'irar don a rubuta cewa ka kasance a nan.",pad:"Taɓa nan",padDone:"An tabbatar",btn:"Fara bincike",ok:"An tabbatar da kasancewarka ✓"}
      ],
      fail:"Bai yi aiki ba. Ana ci gaba a gida; za a sake gwadawa daga baya."
    },
    en: {
      status:{connected:"Connected",searching:"Looking for nodes…",local:"Local only"},
      lite:"Lite mode", skip:"Skip", note:"Your 3D view goes here.",
      s:[
        {t:"Hi! I’m LucIA.",b:"I’ll show you around the island. It takes under a minute.",btn:"Continue"},
        {t:"Enter the island",b:"Your identity is created on this device. You don’t need to do anything.",btn:"Enter",busy:"Creating…",ok:"Your identity is ready ✓"},
        {t:"Confirm you’re here",b:"Tap the circle to record that you were here.",pad:"Tap here",padDone:"Confirmed",btn:"Start exploring",ok:"Presence confirmed ✓"}
      ],
      fail:"That didn’t work. Continuing offline; we’ll retry later."
    }
  };

  /* ---------- State ---------- */
  const $ = id => document.getElementById(id);
  const KEY = "wold.onboarded";
  let lang = (navigator.language||"").startsWith("ha") ? "ha" : "ha"; // default Hausa
  let step = 0, status = "searching", lite = false;
  const cfg = {
    // Hook these to your real code. Each may be async; throw/reject on failure.
    onCreateIdentity: async () => { await new Promise(r => setTimeout(r, 700)); },   // e.g. SecurityManager.createIdentity()
    onPresence:       async () => { await new Promise(r => setTimeout(r, 500)); },   // e.g. PresenceLedger.claim()
    onFinish:         () => {}
  };

  const store = {
    get(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } },
    set(){ try { localStorage.setItem(KEY,"1"); } catch(e){} }
  };

  /* ---------- Status chip ---------- */
  function setStatus(s){
    status = s;
    $("wux-status").dataset.status = s;
    $("wux-status-text").textContent = T[lang].status[s];
    document.dispatchEvent(new CustomEvent("wold:status",{detail:{status:s}}));
  }

  /* ---------- Lite mode (auto-detect + manual toggle) ---------- */
  function autoLite(){
    const mem = navigator.deviceMemory || 8, cores = navigator.hardwareConcurrency || 8;
    return mem <= 4 || cores <= 4 || Math.min(screen.width, screen.height) < 420;
  }
  function setLite(v){
    lite = v;
    $("wux-lite").setAttribute("aria-pressed", String(v));
    // Listen in your 3D code: lower polygons/shadows/pixel ratio when mode === "lite"
    document.dispatchEvent(new CustomEvent("wold:quality",{detail:{mode:v?"lite":"full"}}));
  }

  /* ---------- Onboarding ---------- */
  function render(){
    const L = T[lang], s = L.s[step];
    $("wux-title").textContent = s.t;
    $("wux-body").textContent = s.b;
    $("wux-next").textContent = s.btn;
    $("wux-next").disabled = false;
    $("wux-skip").textContent = L.skip;
    $("wux-ok").textContent = "";
    $("wux-stamp").classList.remove("show");
    const pad = $("wux-pad");
    pad.hidden = step !== 2;
    pad.classList.remove("done");
    if (step === 2) pad.textContent = s.pad;
    document.querySelectorAll(".steps i").forEach((d,i)=>d.classList.toggle("on", i<=step));
    $("wux-lite").textContent = L.lite;
    $("scene-note").textContent = L.note;
    $("wux-status-text").textContent = L.status[status];
    document.documentElement.lang = lang;
    $("wux-lang").textContent = lang.toUpperCase();
  }

  async function guarded(fn, okText){
    try { await fn(); $("wux-ok").textContent = okText || ""; return true; }
    catch(e){ $("wux-ok").textContent = T[lang].fail; setStatus("local"); return false; }
  }

  async function next(){
    const btn = $("wux-next");
    if (step === 1){                         // identity, silently in the background
      btn.disabled = true; btn.textContent = T[lang].s[1].busy;
      await guarded(cfg.onCreateIdentity, T[lang].s[1].ok);   // on failure, still continue locally
      await new Promise(r => setTimeout(r, 500));
    }
    if (step === 2){ finish(); return; }
    step++; render();
  }

  let claimed = false;
  async function claim(){
    if (claimed) return;
    const pad = $("wux-pad");
    const ok = await guarded(cfg.onPresence, T[lang].s[2].ok);
    claimed = ok;
    if (ok){ pad.classList.add("done"); pad.textContent = T[lang].s[2].padDone; $("wux-stamp").classList.add("show"); }
  }

  function finish(){
    store.set();
    $("wux").hidden = true;
    cfg.onFinish();
    document.dispatchEvent(new CustomEvent("wold:onboarded"));
  }

  function open(){ step = 0; claimed = false; $("wux").hidden = false; render(); $("wux-next").focus(); }

  /* ---------- Events ---------- */
  $("wux-next").addEventListener("click", next);
  $("wux-skip").addEventListener("click", finish);
  $("wux-pad").addEventListener("click", claim);
  $("wux-pad").addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); claim(); } });
  $("wux-lite").addEventListener("click", () => setLite(!lite));
  $("wux-lang").addEventListener("click", () => { lang = lang==="ha" ? "en" : "ha"; render(); });

  /* ---------- Public API ---------- */
  window.WoldUX = {
    init(options){ Object.assign(cfg, options||{}); },
    setStatus,            // "connected" | "searching" | "local"
    setLite,              // true | false
    replay: open
  };

  /* ---------- Start ---------- */
  setStatus("searching");
  setLite(autoLite());
  render();
  if (!store.get()) open();

  /* ---------- DEMO ONLY: remove when you connect real P2P ----------
     Simulates finding nodes after 3s. Replace with real events from your P2P layer:
       WoldUX.setStatus("connected") when ≥1 peer; "searching" while dialing; "local" if none/failed. */
  setTimeout(() => setStatus("connected"), 3000);
})();
</script>
</body>
</html>
